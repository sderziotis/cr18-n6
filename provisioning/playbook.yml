# ─────────────────────────────────────────────
#  Module 6 - Traffic Analysis (combined)
#  Covers N6a (Traffic Analysis CTF1) and N6b (Traffic Analysis CTF2)
#  Topology: cr18-N6-v1  (pentester + router)
#
#  Required files next to this playbook:
#    files/orion-internal.pcapng   (N6a capture)
#    files/orion-ids.pcapng        (N6b capture)
#    files/fast.log                (N6b IDS alert log)
# ─────────────────────────────────────────────

- name: init machine pentester
  hosts:
    - pentester
  become: true

  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
    - role: user-access
      user_access_username: user
      user_access_password: 'password123'
      user_access_sudo: true

  tasks:

    # ─── apt housekeeping ────────────────────────────────────────
    - name: Disable unattended-upgrades during provisioning
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Kill leftover apt/dpkg processes
      ansible.builtin.shell: |
        pkill -9 apt || true
        pkill -9 dpkg || true
      changed_when: false
      failed_when: false

    - name: Wait for apt lock to be released
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false
      failed_when: false

    # ─── analysis tooling ────────────────────────────────────────
    # Preseed before installing: wireshark-common otherwise opens an
    # interactive debconf dialog and provisioning hangs. This also
    # creates the "wireshark" group used below.
    - name: Preseed wireshark-common (no interactive dialog)
      ansible.builtin.debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        value: 'true'
        vtype: boolean

    - name: Install analysis tools
      ansible.builtin.apt:
        name:
          - wireshark
          - tshark
          - unzip
          - file
          - xxd
        state: present
        update_cache: 'yes'

    - name: Add trainee to the wireshark group
      ansible.builtin.user:
        name: user
        groups: wireshark
        append: true

    # ─── case files ──────────────────────────────────────────────
    # Root-owned and read-only: a trainee who overwrites an evidence
    # file cannot lock themselves out of a level.
    - name: Create case directory
      ansible.builtin.file:
        path: /home/user/case
        state: directory
        owner: root
        group: root
        mode: '0755'

    # ---- N6a evidence ----
    - name: Deploy the Orion Retail capture (N6a)
      ansible.builtin.copy:
        src: files/orion-internal.pcapng
        dest: /home/user/case/orion-internal.pcapng
        owner: root
        group: root
        mode: '0444'

    - name: Verify the N6a capture deployed intact
      ansible.builtin.stat:
        path: /home/user/case/orion-internal.pcapng
        checksum_algorithm: sha256
      register: pcap_n6a_stat
      failed_when: >
        pcap_n6a_stat.stat.checksum !=
        'a750921b6b95aa35f2a97d7646bb8d1ff29eaa4d186429ea9eca40810dba78ab'

    # ---- N6b evidence ----
    - name: Deploy the IDS-evasion capture (N6b)
      ansible.builtin.copy:
        src: files/orion-ids.pcapng
        dest: /home/user/case/orion-ids.pcapng
        owner: root
        group: root
        mode: '0444'

    - name: Verify the N6b capture deployed intact
      ansible.builtin.stat:
        path: /home/user/case/orion-ids.pcapng
        checksum_algorithm: sha256
      register: pcap_n6b_stat
      failed_when: >
        pcap_n6b_stat.stat.checksum !=
        '1aaf3da37742bd929a702fa6b2b6440dd48bd4ed7fff19a51bf23925dfc88a35'

    - name: Deploy the IDS alert log (N6b)
      ansible.builtin.copy:
        src: files/fast.log
        dest: /home/user/case/fast.log
        owner: root
        group: root
        mode: '0444'

    - name: Verify the N6b alert log deployed intact
      ansible.builtin.stat:
        path: /home/user/case/fast.log
        checksum_algorithm: sha256
      register: log_n6b_stat
      failed_when: >
        log_n6b_stat.stat.checksum !=
        'adbd1ce2bbdafcde44aa7b794d8485c2cdfe84b10c6a9d7e761351b749e95965'

    - name: Deploy the case brief
      ansible.builtin.copy:
        dest: /home/user/case/README.txt
        owner: user
        group: user
        mode: '0644'
        content: |
          ORION RETAIL LTD - INCIDENT REVIEWS
          ===================================

          This workstation holds the evidence for two exercises.

          N6a - Traffic Analysis CTF1
            The internal web admin panel was accessed without authorization.
            Evidence:  ~/case/orion-internal.pcapng

          N6b - Traffic Analysis CTF2 (IDS evasion)
            After the first breach a signature IDS was deployed; a second
            intrusion succeeded anyway.
            Evidence:  ~/case/orion-ids.pcapng   and   ~/case/fast.log

          All evidence files are read-only.
          Tools: Wireshark, tshark, unzip.

          The LAN in the captures, 172.20.30.0/24, no longer exists. These
          are offline reviews - there is nothing to connect to.

          Answers in the training portal are case-sensitive.

    - name: Add a case-folder shortcut to the trainee shell
      ansible.builtin.blockinfile:
        path: /home/user/.bashrc
        marker: "# {mark} KYPO N6 CASE SHORTCUT"
        block: |
          alias case='cd /home/user/case'
        create: false

    # ─── desktop ─────────────────────────────────────────────────
    - name: Create Polkit rule to disable colord password prompts
      ansible.builtin.copy:
        dest: /etc/polkit-1/rules.d/45-allow-colord.rules
        mode: '0644'
        content: |
          polkit.addRule(function(action, subject) {
              if ((action.id == "org.freedesktop.color-manager.create-device" ||
                   action.id == "org.freedesktop.color-manager.create-profile" ||
                   action.id == "org.freedesktop.color-manager.delete-device" ||
                   action.id == "org.freedesktop.color-manager.delete-profile" ||
                   action.id == "org.freedesktop.color-manager.modify-device" ||
                   action.id == "org.freedesktop.color-manager.modify-profile") &&
                  subject.isInGroup("user")) {
                  return polkit.Result.YES;
              }
          });

    - name: Ensure xfconf config directory exists
      ansible.builtin.file:
        path: /home/user/.config/xfce4/xfconf/xfce-perchannel-xml
        state: directory
        owner: user
        group: user
        mode: '0755'
        recurse: true

    - name: Set XFCE DPI to 170
      ansible.builtin.copy:
        dest: /home/user/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        owner: user
        group: user
        mode: '0644'
        content: |
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xsettings" version="1.0">
            <property name="Xft" type="empty">
              <property name="DPI" type="int" value="170"/>
            </property>
          </channel>

    - name: Enable OpenSSH server
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started


- name: Disable unattended apt upgrades
  hosts: pentester,man
  become: true
  tasks:
    - name: Disable unattended upgrades in apt periodic config
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
